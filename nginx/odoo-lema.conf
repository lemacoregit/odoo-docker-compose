# Nginx reverse proxy for Odoo 19 (odoo-lema)
# Place this file at /etc/nginx/sites-available/odoo-lema.conf and symlink it
# into sites-enabled, or include it directly from nginx.conf.
#
# Ports below must match ODOO_LEMA_HTTP_PORT and ODOO_LEMA_LONGPOLLING_PORT in .env.

upstream odoo_web {
    # Odoo main HTTP server (web UI, RPC, controllers)
    server 127.0.0.1:8019;
}

upstream odoo_longpoll {
    # Odoo longpolling/gevent server — powers the bus (realtime notifications,
    # Discuss messaging, live chat). Must NOT go through odoo_web.
    server 127.0.0.1:8027;
}

# Rate limiting for login endpoint (brute-force mitigation)
limit_req_zone $binary_remote_addr zone=odoo_login:10m rate=5r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name erp.lemacore.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name erp.lemacore.com;

    ssl_certificate     /etc/letsencrypt/live/erp.lemacore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.lemacore.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Odoo can generate large responses (reports, exports) and accepts large uploads
    client_max_body_size 200m;
    proxy_read_timeout 900s;
    proxy_connect_timeout 900s;
    proxy_send_timeout 900s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Forwarded headers — required for Odoo's proxy_mode to trust X-Forwarded-*
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    access_log /var/log/nginx/odoo-lema.access.log;
    error_log  /var/log/nginx/odoo-lema.error.log;

    gzip on;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json;
    gzip_min_length 1024;

    # ── WebSocket / bus — realtime notifications, Discuss, live chat ──
    # Odoo 16+ uses native WebSocket at /websocket served by the gevent
    # worker (longpolling port). Must be matched before the "/" location.
    location /websocket {
        proxy_pass http://odoo_longpoll;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # ── Login endpoint — rate limited ──
    location /web/login {
        limit_req zone=odoo_login burst=10 nodelay;
        proxy_pass http://odoo_web;
        proxy_redirect off;
    }

    # ── Static assets — long cache ──
    location ~* /web/(static|assets)/ {
        proxy_pass http://odoo_web;
        proxy_cache_valid 200 60m;
        expires 864000;
        add_header Cache-Control "public, immutable";
    }

    # ── Everything else — main Odoo HTTP server ──
    location / {
        proxy_pass http://odoo_web;
        proxy_redirect off;
    }
}
