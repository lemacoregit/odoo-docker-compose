      - ./etc/requirements.txt:/etc/odoo/requirements.txt
      - ./addons/redis:/mnt/redis-addons
      - ./addons/18e/rpc-demo:/mnt/18e/rpc-demo
      - ./addons/18c/default:/mnt/18c/default-addons
      - ./addons/18c/demo/apps1:/mnt/18c/demo-addons/apps1
      - ./addons/18c/demo/apps2:/mnt/18c/demo-addons/apps2
