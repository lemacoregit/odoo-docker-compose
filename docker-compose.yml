networks:
  lema-odoo-net:
    driver: bridge

services:

  db:
    image: postgres:15
    container_name: postgres-15-lema
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB:-postgres}'
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./etc/postgres:/var/lib/postgresql/data
      - ./etc/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lema-odoo-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    restart: always

  db-init:
    image: postgres:15
    container_name: postgres-init-roles
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB:-postgres}'
      PG_HOST: db
    volumes:
      - ./etc/postgres-init/01_create_roles.sh:/init.sh:ro
    command: ["bash", "/init.sh"]
    networks:
      - lema-odoo-net
    restart: on-failure

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer-lema
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: '${POSTGRES_USER}'
      DB_PASSWORD: '${POSTGRES_PASSWORD}'
      DB_NAME: "*"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: session
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "10"
      SERVER_IDLE_TIMEOUT: "600"
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      ADMIN_USERS: '${POSTGRES_USER}'
    ports:
      - "${PG_BOUNCER_PORT}:5432"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - lema-odoo-net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        tag: "{{.Name}}"
    restart: always

  redis:
    image: redis:8.2.5
    container_name: redis-lema-session
    ports:
      - "${REDIS_EXTERNAL_PORT}:6379"
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - "${ODOO_SESSION_REDIS_PASSWORD}"
    volumes:
      - ./etc/conf/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${ODOO_SESSION_REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - lema-odoo-net
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
        reservations:
          memory: 64m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    restart: always

  odoo-lema:
    image: docker.io/mraldirs1231/odoo18e:latest
    user: root
    container_name: odoo-18-lema
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "${ODOO_LEMA_HTTP_PORT}:8069"
      - "${ODOO_LEMA_LONGPOLLING_PORT}:8072"
    environment:
      HOST: pgbouncer
      PORT: "5432"
      USER: '${POSTGRES_USER_LEMA}'
      PASSWORD: '${POSTGRES_PASSWORD}'
      DB: '${POSTGRES_DB:-postgres}'
      REDIS_PASSWORD: '${ODOO_SESSION_REDIS_PASSWORD}'
      ODOO_SESSION_REDIS: '${ODOO_SESSION_REDIS}'
      ODOO_SESSION_REDIS_HOST: '${ODOO_SESSION_REDIS_HOST}'
      ODOO_SESSION_REDIS_PORT: '${ODOO_SESSION_REDIS_PORT}'
      ODOO_SESSION_REDIS_PASSWORD: '${ODOO_SESSION_REDIS_PASSWORD}'
      ODOO_SESSION_REDIS_SSL: '${ODOO_SESSION_REDIS_SSL}'
      ODOO_SESSION_REDIS_SSL_CERT_REQS: '${ODOO_SESSION_REDIS_SSL_CERT_REQS}'
      ODOO_SESSION_REDIS_CLUSTER: '${ODOO_SESSION_REDIS_CLUSTER}'
      ODOO_SESSION_REDIS_URL: '${ODOO_SESSION_REDIS_URL}'
      ODOO_SESSION_REDIS_PREFIX: '${ODOO_SESSION_REDIS_PREFIX}'
      ODOO_SESSION_REDIS_EXPIRATION: '${ODOO_SESSION_REDIS_EXPIRATION}'
      ODOO_SESSION_REDIS_EXPIRATION_ANONYMOUS: '${ODOO_SESSION_REDIS_EXPIRATION_ANONYMOUS}'
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./etc/conf/lema.conf:/etc/odoo/odoo.conf
      - ./etc/logs:/etc/odoo/logs
      - ./etc/addons:/etc/odoo/addons
      - ./etc/filestore:/etc/odoo/filestore
      - ./etc/sessions:/etc/odoo/sessions
      - ./etc/requirements.txt:/etc/odoo/requirements.txt
      - ./addons/redis:/mnt/redis-addons
      - ./addons/18e/bpass:/mnt/18e/bpass-addons
      - ./addons/18e/default:/mnt/18e/default-addons
      - ./addons/18e/rpc-demo:/mnt/18e/rpc-demo
      - ./addons/18e/lema:/mnt/18e/lema-addons
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8069/web/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s
    networks:
      - lema-odoo-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        tag: "{{.Name}}"
    restart: always

  odoo-demo18e:
    image: docker.io/mraldirs1231/odoo18e:latest
    user: root
    container_name: odoo-18e-demo
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "${ODOO_DEMO18E_HTTP_PORT}:8069"
      - "${ODOO_DEMO18E_LONGPOLLING_PORT}:8072"
    environment:
      HOST: pgbouncer
      PORT: "5432"
      USER: '${POSTGRES_USER_DEMO18E}'
      PASSWORD: '${POSTGRES_PASSWORD}'
      DB: '${POSTGRES_DB:-postgres}'
      DEMO_ERP_DB_NAME: '${DEMO_ERP_DB_NAME:-lema_production}'
      REDIS_PASSWORD: '${ODOO_SESSION_REDIS_PASSWORD}'
      ODOO_SESSION_REDIS: '${ODOO_SESSION_REDIS}'
      ODOO_SESSION_REDIS_HOST: '${ODOO_SESSION_REDIS_HOST}'
      ODOO_SESSION_REDIS_PORT: '${ODOO_SESSION_REDIS_PORT}'
      ODOO_SESSION_REDIS_PASSWORD: '${ODOO_SESSION_REDIS_PASSWORD}'
      ODOO_SESSION_REDIS_SSL: '${ODOO_SESSION_REDIS_SSL}'
      ODOO_SESSION_REDIS_SSL_CERT_REQS: '${ODOO_SESSION_REDIS_SSL_CERT_REQS}'
      ODOO_SESSION_REDIS_CLUSTER: '${ODOO_SESSION_REDIS_CLUSTER}'
      ODOO_SESSION_REDIS_URL: '${ODOO_SESSION_REDIS_URL}'
      ODOO_SESSION_REDIS_PREFIX: '${ODOO_SESSION_REDIS_PREFIX}'
      ODOO_SESSION_REDIS_EXPIRATION: '${ODOO_SESSION_REDIS_EXPIRATION}'
      ODOO_SESSION_REDIS_EXPIRATION_ANONYMOUS: '${ODOO_SESSION_REDIS_EXPIRATION_ANONYMOUS}'
    volumes:
      - ./entrypoint.sh:/entrypoint.sh
      - ./etc/conf/18e.conf:/etc/odoo/odoo.conf
      - ./etc/logs:/etc/odoo/logs
      - ./etc/addons:/etc/odoo/addons
      - ./etc/filestore:/etc/odoo/filestore
      - ./etc/sessions:/etc/odoo/sessions
      - ./etc/requirements.txt:/etc/odoo/requirements.txt
      - ./addons/redis:/mnt/redis-addons
      - ./addons/18e/bpass:/mnt/18e/bpass-addons
      - ./addons/18e/default:/mnt/18e/default-addons
      - ./addons/18e/rpc-demo:/mnt/18e/rpc-demo
      - ./addons/18e/demo/apps1:/mnt/18e/demo-addons/apps1
      - ./addons/18e/demo/apps2:/mnt/18e/demo-addons/apps2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8069/web/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s
    networks:
      - lema-odoo-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        tag: "{{.Name}}"
    restart: always

  odoo-demo18c:
    image: odoo:18.0
    user: root
    container_name: odoo-18c-demo
    depends_on:
